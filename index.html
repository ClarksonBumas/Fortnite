<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fortnite 3D - Three.js Prototype</title>
  <style>
    html,body { height:100%; margin:0; font-family:Arial,Helvetica,sans-serif; background:#111; }
    #gameContainer { position:relative; width:100%; height:100vh; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; }
    #ui { position:absolute; left:12px; top:12px; color:#fff; z-index:10; text-shadow:0 1px 2px rgba(0,0,0,.8); }
    .ui-item { margin-bottom:8px; font-weight:bold; }
    #gameOver { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.85); color:#fff; padding:28px; border-radius:8px; display:none; z-index:20; width:360px; text-align:center; }
    #instructions { position:absolute; right:12px; bottom:12px; color:#fff; background:rgba(0,0,0,0.45); padding:8px 10px; border-radius:6px; font-size:13px; z-index:10; }
    button { cursor:pointer; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="ui">
      <div class="ui-item" id="health">❤️ Health: 100</div>
      <div class="ui-item" id="ammo">🔫 Ammo: 30</div>
      <div class="ui-item" id="players">👥 Players: 10</div>
      <div class="ui-item" id="timer">⏱️ Time: 300s</div>
    </div>

    <div id="gameOver">
      <h1 id="result">GAME OVER</h1>
      <p id="stats"></p>
      <button id="restartBtn">Play Again</button>
    </div>

    <div id="instructions">
      WASD: Move | SPACE: Jump | Mouse: Aim | Click: Shoot | E: Reload | ESC: Pause
    </div>
  </div>

  <!-- Three.js (r128 as requested in README) -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <!-- (optional) include simple helpers if needed later -->
  <script src="game3d.js"></script>
</body>
</html>
