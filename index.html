<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pool — Fortnite (Playable)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>HTML5 Pool</h1>
  <div id="game">
    <canvas id="table" width="1000" height="500"></canvas>
    <div id="ui">
      <div id="controls">
        <button id="reset">Reset</button>
        <button id="nextTurn">Next Turn</button>
        <label>Friction <input id="friction" type="range" min="0.98" max="0.999" step="0.001" value="0.995"></label>
      </div>
      <div id="info">
        <p id="turn">Turn: Player 1 (White)</p>
        <p id="message">Click & drag to aim; release to shoot. Hold Shift for a soft shot.</p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
